<!DOCTYPE html>
<html>
<head>
<title>SOURCE ry</title>
<meta content="width=device-width, initial-scale=1" name="viewport"/>

<link href="/resources/css/style.css" rel="stylesheet" type="text/css">
<link href="/resources/images/favicon.ico" rel="icon" type="image/x-icon">

<body>
    <header class="section-hero">
        <img alt="SOURCE ry hero image" src="/resources/images/hero.png"/>

    <nav class="nav-header" id="nav-header"></nav>
    <section class="section-page">

        </section>

                </a>
                <a href="https://www.reaktor.com/" target="_blank">
                    <img alt="Reaktor logo" src="/resources/images/partners/reaktor.png"/>
                </a>
                <a href="https://toas.fi/" target="_blank">
                    <img alt="TOAS logo" src="/resources/images/partners/toas.png"/>

        <section class="section-carousel">
            <button class="carousel-button" id="carousel-back-button" type="button">&#10094;</button>
            <div class="item-carousel" id="item-carousel">
                <div class="item-carousel-slide">
                    <img alt="Carousel image 1" src="/resources/images/istuva-potikka-480p.png"/>

                <div class="item-carousel-slide">
                    <img alt="Carousel image 4" src="/resources/images/istuva-potikka-480p.png"/>
                </div>
                <div class="item-carousel-slide">
                    <img alt="Carousel image 5" src="/resources/images/source-logo-512p.png"/>
                </div>
            </div>
            <button class="carousel-button" id="carousel-next-button" type="button">&#10095;</button>
