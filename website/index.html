<!DOCTYPE html>
<html>
<head>
<title>SOURCE ry</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" type="text/css" href="/resources/css/style.css">
<link rel="icon" type="image/x-icon" href="/resources/images/favicon.ico">
</head>
<body>
    <header class="section-hero">
        <img src="/resources/images/hero.png" alt="SOURCE ry hero image"/>
        <h1>SOURCE ry</h1>
    </header>
    <nav id="nav-header" class="nav-header">
        <div class="nav-inner">
            <a href="./" class="nav-logo">
                <img src="/resources/images/favicon.ico" alt="SOURCE ry logo"/>
            </a>
            <div class="nav-links">
                <a href="./partners" class="nav-trigger" data-translate="partners"></a>
                <a href="./events" class="nav-trigger" data-translate="events"></a>
                <a href="./titelan" class="nav-trigger" data-translate="titelan"></a>
                <a href="./students" class="nav-trigger" data-translate="students"></a>
                <a href="./about" class="nav-trigger" data-translate="about"></a>
                <a href="./contact" class="nav-trigger" data-translate="contact"></a>
            </div>
            <div class="nav-right">
                <button class="nav-lang-button" id="lang-button" type="button" data-translate="langButton"></button>
                <div class="nav-hamburger" id="nav-hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </div>
        </div>
    </nav>
    <section class="section-page">
        <section class="section-text">
            <p data-translate="home.para.1"></p>
            <p data-translate="home.para.2"></p>
            <p data-translate="home.para.3"></p>
            <p data-translate="home.para.4"></p>
        </section>
        <section class="section-image-right">
            <section class="item-text">
                <h2>Testi Testinen</h2>
                <p data-translate="home.section1.text"></p>
            </section>
            <section class="item-image">
                <img src="/resources/images/kyltti-potikka-480p.png" alt="Kyltti-potikka"/>
            </section>
        </section>
        <section class="section-image-left">
            <section class="item-image">
                <img src="/resources/images/istuva-potikka-480p.png" alt="Istuva-potikka"/>
            </section>
            <section class="item-text">
                <h2>Testi Testinen</h2>
                <p data-translate="home.section2.text"></p>
            </section>
        </section>
    </section>
    <footer class="footer">
        <section class="footer-text">
            <p>
                <span>&copy;</span><script>document.write(new Date().getFullYear())</script>
                <span data-translate="footer.text"></span>
            </p>
        </section>
    </footer>
    <script type="module" src="/resources/js/translation.js" defer></script>
    <script type="module" src="/resources/js/nav.js" defer></script>
</body>
</html>
